<script>

const WD={"tap":{"perfect":[50,50],"great":[80,80],"good":[105,105],"bad":[125,125],"miss":[150,150]},"flick":{"perfect":[50,50],"great":[60,80],"good":[0,105],"bad":[0,125],"miss":[0,150]},"head":{"perfect":[50,50],"great":[80,80],"good":[105,105],"bad":[125,125],"miss":[150,150]},"trace":{"hit":[120,120]},"tick":{"hit":[0,0]},"damage":{"hit":[0,10]}};

// ===== 譜面フォーマット =====

// lane=左端のレーン(0始まり)、width=またがるレーン数(省略で1)、len=ロングの長さ(拍)
function demoChart(n,bpm=140){
  const out=[];let k=0;
  for(let b=2;b<66;b++){
    const bar=b>>3,pos=b%8,last=n-1;
    if(bar%4===1&&pos===4)out.push({type:'slide',points:[{beat:b,lane:last},{beat:b+3,lane:last}],head:'flick'});
    else if(bar%4===3&&pos===4)out.push({type:'slide',curve:'smooth',points:[{beat:b,lane:0},{beat:b+1.5,lane:n-2,width:2},{beat:b+3,lane:1}],tail:'flick',relays:[b+.75,b+2.25]});
    else if(bar===0&&pos===4)out.push({type:'guide',curve:'out',points:[{beat:b,lane:0},{beat:b+3,lane:n-2,width:2}]});
    else if(bar%2===1&&pos>4)continue;
    else if(bar%2===0&&bar%4!==0&&pos===6)out.push({type:'damage',beat:b,lane:last});
    else if(pos===3)out.push({type:'trace',beat:b,lane:k++%(n-1)});
    else if(pos===5&&bar%2===0)out.push({type:'flick',beat:b,lane:k++%(n-1),layer:'fast'});
    else if(pos===0)out.push({type:'tap',beat:b,lane:0,width:2,crit:true});
    else if(pos===1&&bar%2===0)out.push({type:'tap',beat:b,lane:n-2,from:0,moveAt:2});
    else out.push({type:'tap',beat:b,lane:k++%(n-1)});
  }
  return {title:'デモ',lanes:n,
    tempo:[{beat:0,bpm},{beat:32,bpm:bpm+30}],
    meter:[{beat:0,num:4,den:4},{beat:48,num:3,den:4}],
    scroll:[{beat:40,speed:0},{beat:41,speed:2,ramp:true},{beat:44,speed:1},{beat:52,speed:-1},{beat:53,speed:1}],
    layers:{fast:[{beat:0,speed:1.8}]},

}
function validate(c){
  const err=m=>{throw Error(m)};
  if(!(c.lanes>=1)||!Array.isArray(c.notes))err('lanes・notes が必要です');
  if(c.offset!==undefined&&typeof c.offset!=='number')err('offset は数値(秒)です');
  const asc=(a,nm,f)=>{
    if(!Array.isArray(a))err(nm+' は配列です');
    a.forEach((q,i)=>{
      if(!(q.beat>=0)||(i&&q.beat<=a[i-1].beat))err(nm+'['+i+'] の beat が不正です(0以上・昇順)');
      f(q,i);
    });
  };
  if(c.tempo===undefined&&!(c.bpm>0))err('bpm か tempo が必要です');
  const tp=c.tempo||[{beat:0,bpm:c.bpm}];
  asc(tp,'tempo',q=>{if(!(q.bpm>0))err('tempo の bpm は正の数です')});
  if(!tp.length||tp[0].beat!==0)err('tempo は beat 0 から始めてください');
  if(c.meter){
    asc(c.meter,'meter',q=>{if(!Number.isInteger(q.num)||q.num<1||![1,2,4,8,16].includes(q.den))err('meter の num/den が不正です')});
    if(!c.meter.length||c.meter[0].beat!==0)err('meter は beat 0 から始めてください');
  }
  const sp=q=>{if(typeof q.speed!=='number')err('speed は数値です')};
  if(c.scroll)asc(c.scroll,'scroll',sp);
  for(const k in c.layers||{})asc(c.layers[k],'layers.'+k,sp);
  const T=['tap','flick','trace','damage','long','slide','guide'];
  const bad=(i,m)=>{throw Error('notes['+i+'] '+m)};
  const inR=(l,w)=>l>=0&&w>0&&l+w<=c.lanes;
  c.notes.forEach((d,i)=>{
    if(!T.includes(d.type))bad(i,'の type が不正です');
    if(d.layer!==undefined&&!(String(d.layer) in (c.layers||{})))bad(i,'の layer が layers に未定義です');
    if(d.type==='slide'||d.type==='guide'){
      const p=d.points;
      if(!Array.isArray(p)||p.length<2)bad(i,'の points は2点以上必要です');
      p.forEach((q,j)=>{
        if(!(q.beat>=0)||(j&&q.beat<=p[j-1].beat))bad(i,'の points['+j+'] の beat が不正です(昇順に)');
        if(!inR(q.lane,q.width||1))bad(i,'の points['+j+'] が範囲外です');
      });
    }else{
      if(!(d.beat>=0))bad(i,'の beat が不正です');
      if(!inR(d.lane,d.width||1))bad(i,'の lane/width が範囲外です');
    }
    if(d.type==='long'&&!(d.len>0))bad(i,'の len が必要です');
    if(d.relays!==undefined&&!(Array.isArray(d.relays)&&d.relays.every(v=>typeof v==='number')))bad(i,'の relays は拍の数値配列です');
    if(d.head!==undefined&&!['tap','flick','trace','damage','none'].includes(d.head))bad(i,'の head は tap/flick/trace/damage/none');
    if(d.tail!==undefined&&!['none','tap','flick','trace','damage','hold'].includes(d.tail))bad(i,'の tail は none/tap/flick/trace/damage');
    if(d.from!==undefined){const ml=d.moveLen??1,ma=d.moveAt??2;if(!inR(d.from,d.width||1)||!(ml>0)||ma<ml)bad(i,'の from/moveAt/moveLen が不正です')}
  });
}

// ===== テンポ・ソフラン =====
// 拍→秒: テンポ変化に対応。落下は「秒」基準なのでBPMが変わっても速さは変わらない
function B2S(b){let i=TM.length-1;while(i>0&&TM[i].beat>b)i--;return TM[i].sec+(b-TM[i].beat)*60/TM[i].bpm}
// スクロール位置 S(t)=∫速度dt。全体ソフラン×レイヤーを区間ごとに2次式で厳密に積分(ramp対応)
function mkScroll(g,l){
  const ts=[...new Set([0,...g.map(f=>f.t),...l.map(f=>f.t)])].sort((a,b)=>a-b);
  const segs=[];let S=0;
  const ev=(tl,a,m)=>{
    let k=-1;for(let i=0;i<tl.length;i++)if(tl[i].t<=m)k=i;
    if(k<0)return [1,0];
    const f=tl[k],nx=tl[k+1];
    if(f.ramp&&nx&&nx.t>f.t){const sl=(nx.v-f.v)/(nx.t-f.t);return [f.v+sl*(a-f.t),sl]} // 同時刻のマーカーでは0除算しない
    return [f.v,0];
  };
  ts.forEach((a,i)=>{
    const b=ts[i+1],m=b===undefined?a+1:(a+b)/2;
    const [gv,gs]=ev(g,a,m),[lv,ls]=ev(l,a,m);
    const sg={a,S0:S,c0:gv*lv,c1:gv*ls+gs*lv,c2:gs*ls};
    segs.push(sg);
    if(b!==undefined){const x=b-a;S+=sg.c0*x+sg.c1*x*x/2+sg.c2*x*x*x/3}
  });
  return segs;
}
function spos(k,t){
  const segs=SC.get(k);
  if(t<0)return t; // 0秒より前(助走)は常に×1
  let lo=0,hi=segs.length-1;
  while(lo<hi){const m=(lo+hi+1)>>1;if(segs[m].a<=t)lo=m;else hi=m-1}
  const q=segs[lo],x=t-q.a;
  return q.S0+q.c0*x+q.c1*x*x/2+q.c2*x*x*x/3;
}

function mirrorChart(c){ // ミラー譜面: レーンを左右反転(レーン数は同じ)

  return {...c,notes:c.notes.map(d=>{
    const o={...d};
    if(d.points)o.points=d.points.map(p=>({...p,lane:f(p.lane,p.width)}));
    else{o.lane=f(d.lane,d.width);if(d.from!==undefined)o.from=f(d.from,d.width)}
    return o;
  })};
}
function compile(c){
  const tp=c.tempo||[{beat:0,bpm:c.bpm}];

}

function beep(f,v,d,at){const o=ctx.createOscillator(),a=ctx.createGain();o.frequency.value=f;o.connect(a);a.connect(ctx.destination);
  const s=at??ctx.currentTime;a.gain.setValueAtTime(v,s);a.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}
// ----- ノーツSE: 種別(tap/flick/trace/crit)ごとに音色・音量を持つ。音色は内蔵合成 or 読み込んだ音声ファイル -----

const seDef=k=>SEEMB[k]?'embed':(DEFT[k]||'beep');
const SEF={tap:1,flick:1.3,trace:.75,crit:1.75,critflick:2.3,crittrace:1.3,dmghit:.5,dmgsafe:1}; // 内蔵音色の高さ倍率(種別で音程を変える)
let NB=null,NBc=null;

  const env=(g,pk,d)=>{g.gain.setValueAtTime(pk,t);g.gain.exponentialRampToValueAtTime(.001,t+d)};
  const osc=(type,f0,f1,pk,d)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);env(g,pk,d);o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.02)};

let pv=false,pvT=0;
const T=()=>pv?pvT:ctx.currentTime-song0-CFG.offset;

// ===== 判定 =====
// 判定のカテゴリ: tap/flick/trace/head(帯の始点)/edge(始点・終点に指定したノーツ)/relay(中継点)/tick(8分判定)。クリティカルは先頭にc
const catN=n=>n.pts?'head':n.par?'edge':(n.type==='flick'?'flick':n.type==='trace'?'trace':'tap');
function catCounts(ns){ // 判定カテゴリごとの個数
  const r={},add=(cat,crit)=>{const k=(crit?'c':'')+cat;r[k]=(r[k]||0)+1};
  for(const n of ns){
    if(n.done||n.type==='damage'||n.type==='guide')continue;
    if(n.pts){if(n.hrect)add('head',n.crit);n.ticks.forEach((_,i)=>add(n.tsfx[i]?'relay':'tick',n.crit))}
    else add(catN(n),n.crit);
  }
  return r;
}
function calcSM(){ // この譜面の重み合計と、重み1あたりの点
  const r=catCounts(notes);let W=0;for(const k in r)W+=r[k]*CFG.scoreCfg.w[k];
  SM={W,unit:W>0?1e6/W:0};
}
function judge(j,crit,sd,cat){
  last=j+(crit?' ★':'');lastT=T();cnt[j]=(cnt[j]||0)+1;
  lastFL=null; // 直前の判定がfast/lateか(perfect以外でタイミングがあるときだけ)
  if(sd!==undefined&&j!=='perfect'&&j!=='miss'){if(sd>0)late++;else fast++;lastFL=sd>0?'late':'fast'}
  if(j!=='perfect')nonP++;
  if(j==='bad'||j==='miss'){combo=0;brk++}else{combo++;maxCombo=Math.max(maxCombo,combo)}
  if(cat)score+=SM.unit*CFG.scoreCfg.w[(crit?'c':'')+cat]*CFG.scoreCfg.acc[j];
}
const esc=t=>String(t).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function stopAudio(){try{src&&src.stop()}catch(e){}src=null}
const ovl=(n,i)=>i+1>n.lane+.001&&i<n.lane+n.w-.001; // レーンiがノーツと重なっているか(小数位置のスライドはまたぐ両レーンが対象)
const hd=n=>{for(let i=0;i<L;i++)if(held[i]>0&&ovl(n,i))return true;return false};
const cover=(n,l)=>ovl(n,l);
const nkind=n=>n.type==='tap'?'tap':n.type==='flick'?'flick':n.type==='trace'?'trace':n.type==='damage'?'damage':'head';
function jname(k,sd){ // 時間差sd(秒,負=早い)→判定名。どれにも入らなければmiss(吸われたが範囲外=miss扱い)
  const w=WC[k];
  for(const j of NAMES){const a=w[j];if(sd<0?-sd<=a[0]:sd<=a[1])return j}
  return 'miss';
}
function nearest(l,types,flag){ // そのレーンを覆うノーツのうち、missの範囲に入っていて時間が一番近いもの
  let best=null,bd=9;const t=T();
  for(const n of notes){
    if(n.done||n.pd!==undefined||(flag&&n.head)||!types.includes(n.type)||!cover(n,l))continue;
    const m=WC[nkind(n)].miss,sd=t-n.t;
    if(sd<-m[0]||sd>m[1])continue;
    const d=Math.abs(sd);
    if(d<bd){best=n;bd=d}
  }
  return best&&{n:best,d:bd,sd:T()-best.t};
}
function press(l){ // タップ・ロング始点
  const r=nearest(l,['tap','long','slide'],true);if(!r)return;
  // この押下が、同じレーンのフリック/トレースのためのもの(時間的にそちらが近い)なら、タップを吸わない
  const t=T();
  for(const n of notes){
    if(n.done||(n.type!=='flick'&&n.type!=='trace')||n.pd!==undefined||n.la||!cover(n,l))continue;
    const w=n.type==='flick'?WC.flick.miss:WC.trace.hit,sd=t-n.t;
    if(sd>=-w[0]&&sd<=w[1]&&Math.abs(sd)<r.d)return;
  }
  const j=jname(nkind(r.n),r.sd);
  if(j==='miss'&&r.sd<0)return; // 判定範囲より早い入力は無視(ノーツを消費してミスにしない)
  r.n.head=true;if(r.n.type==='tap')r.n.done=true;
  judge(j,r.n.crit,r.sd,catN(r.n));if(j!=='miss')se(r.n);
}
function scrub(l,id){ // フリック（擦り）
  const r=nearest(l,['flick'],false);if(!r)return;
  if(r.sd<0){r.n.pd=id;return} // 判定タイミングより前の入力 → 丁度に入力したものとして待つ(update側で判定。待つ間に離したらrelPendで判定)
  r.n.done=true;const j=jname('flick',r.sd);judge(j,r.n.crit,r.sd,catN(r.n));if(j!=='miss')se(r.n);
}
function relPend(id){ // 待機中に指を離した → 離した瞬間の時間差で判定
  const t=T();
  for(const n of notes){
    if(n.done||n.pd!==id)continue;
    const sd=t-n.t,j=jname('flick',sd);n.done=true;judge(j,n.crit,sd,catN(n));if(j!=='miss')se(n);
  }
}
const ease=(c,u)=>c==='in'?u*u:c==='out'?1-(1-u)*(1-u):c==='smooth'?u*u*(3-2*u):u; // in=加速 out=減速
function posAt(n,time){ // 帯ノーツの時刻ごとの左端レーン(小数)と幅
  const p=n.pts;let i=0;
  while(i<p.length-2&&time>p[i+1].t)i++;
  const a=p[i],b=p[i+1];let u=Math.min(1,Math.max(0,(time-a.t)/(b.t-a.t)));
  u=ease(a.curve,u);
  return {lo:a.lane+(b.lane-a.lane)*u,w:a.w+(b.w-a.w)*u};
}
function holdsAt(n,time){
  const q=posAt(n,time);
  for(let i=0;i<L;i++)if(held[i]>0&&i+1>q.lo+.001&&i<q.lo+q.w-.001)return true;
  return false;
}
function autoPlay(t){ // 譜面テストのオート再生: 時刻が来たノーツを全部perfectで処理
  for(const n of notes){
    if(n.done||n.t>t)continue;
    if(n.type==='tap'||n.type==='flick'||n.type==='trace'){n.done=n.head=true;judge('perfect',n.crit,undefined,catN(n));se(n)}
    else if(n.type==='damage'){n.done=true;se(n,'dmgsafe')}
    else if(n.pts&&n.type!=='guide'){
      if(!n.head){n.head=true;judge('perfect',n.crit,undefined,catN(n));se(n)}
      while(n.ti<n.ticks.length&&n.ticks[n.ti]<=t){judge('perfect',n.crit,undefined,n.tsfx[n.ti]?'relay':'tick');if(n.tsfx[n.ti])se(n,'trace');n.ti++}
    }
  }
}
function update(){
  const t=T(),pt=ut;ut=t;
  if(autoRun)autoPlay(t);
  for(const n of notes){
    if(n.done)continue;
    if(n.type==='tap'||n.type==='flick'){
      if(n.pd!==undefined){if(t>=n.t){n.done=true;judge('perfect',n.crit,undefined,catN(n));se(n)}} // 早く擦った分は判定タイミング丁度で確定
      else if(t>n.t+WC[n.type].miss[1]){n.done=n.head=true;judge('miss')}
    }else if(n.type==='trace'){
      const h=WC.trace.hit;
      if(!n.la&&t>=n.t-h[0]&&hd(n))n.la=true; // 早く触れていたら「丁度に触れた」ことにして待つ
      if(n.la){if(t>=n.t){n.done=true;judge('perfect',n.crit,undefined,catN(n));se(n)}}
      else if(t>n.t+h[1]){n.done=true;judge('miss')}
    }else if(n.type==='damage'){
      const h=WC.damage.hit; // 前フレーム〜今フレームが範囲と重なればOK(短い範囲でもフレームの隙間で漏れない)
      if(t>=n.t-h[0]&&pt<=n.t+h[1]&&hd(n)){n.done=true;combo=0;brk++;lastFL=null;last='damage';lastT=t;se(n,'dmghit')} // 押してしまった
      else if(t>n.t+h[1]){n.done=true;se(n,'dmgsafe')} // 押さずに通した
    }else if(n.type==='guide'){
      if(t>n.t+n.len)n.done=true;
    }else{
      if(!n.head&&t>n.t+WC.head.miss[1]){n.head=true;judge('miss')}
      const h=WC.tick.hit;
      while(n.ti<n.ticks.length){
        const tk=n.ticks[n.ti];
        if(!n.tla&&t>=tk-h[0]&&(holdsAt(n,tk)||(t<=tk+h[1]&&holdsAt(n,t))))n.tla=true; // 判定時刻の位置だけでなく、今見えている帯の位置を押していてもOK
        if(n.tla){if(t>=tk){judge('perfect',n.crit,undefined,n.tsfx[n.ti]?'relay':'tick');if(n.tsfx[n.ti])se(n,'trace');n.tla=false;n.ti++}else break}
        else if(t>tk+h[1]){judge('miss');n.ti++}
        else break;
      }
      if(n.head&&n.ti>=n.ticks.length&&t>=n.t+n.len)n.done=true; // 終点の時刻までは帯を残す
    }
  }
}

// ===== 入力（マルチタッチ。指を滑らせてレーン移動もOK）=====
// レーン配置: レーンの太さは4〜6レーンで共通(細め)。4レーンは従来の間隔のまま隙間が広め、6レーンは間隔を詰めて内側に寄せる。7レーン以上は従来どおり全幅
function geom(w){
  const p6=w/6,li=ST.li;let lp,G;
  if(L>=7){lp=w/L;G=2*li*lp}
  else{
    const T=Math.max(w*.02,p6*(1-2*li)*.84),pt6=T+2*li*p6*.8,pt4=p6*(1-2*li)+2*li*p6*1.5; // T=レーンの太さ / pt6,pt4=6・4レーンのレーン間隔
    lp=pt6+(6-L)*(pt4-pt6)/2;G=lp-T;
  }
  const rp=L>=7?lp:p6; // ノーツの大きさの基準(従来の6レーン相当で固定)
  return {lp,rp,ox:(w-L*lp)/2,IN:G/2,PX:Math.max(0,(lp-rp*(1-2*ST.ni))/2),BX:Math.max(0,(lp-rp*(1-2*ST.bi))/2)};
}
// 押した位置→レーン。隙間は左右どちらか近いレーンに入る(レーン+左右半分の隙間が1マス)
const laneAt=e=>{const G=geom(cv.clientWidth);return Math.min(L-1,Math.max(0,Math.floor((e.clientX-cv.getBoundingClientRect().left-G.ox)/G.lp)))};
function setP(id,l){

      if(n.type==='trace'&&!n.look){rr(x,y-ph*.28,ww,ph*.56,ph*.28);g.fillStyle=n.color||(n.crit?ST.cr:ST.tr);g.fill();diamond(x+ww/2,y,ph*.62,ST.rl)}

  $('zsn').onclick=()=>{setBack=showSelect;showSE('sel')};
  $('zge').onclick=()=>{setBack=showSelect;showSet()};
  $('zrn').onclick=()=>{if(selVis.length>1){let i;do{i=Math.floor(Math.random()*selVis.length)}while(i===selIdx);selGo(i)}};
  $('zst').onclick=async()=>{
    const s=selVis[selIdx];if(!s)return;
    if(s.impl===false){selToast('この曲はまだ未実装です');return}
    const d=pickDiff(s,SS.diff);
    if(!hasChart(s,d)){selToast('この難易度はまだ実装待ちです');return}
    if(s.store){selToast('読み込み中…');try{await prepSong(s)}catch(e){selToast('曲を読み込めません');return}}
    cur={song:s,diff:d};testMode=false;saveSel();start();
  };
  // 難易度リング(#zr はクリックを通さない設定なので、円だけ有効にする)
  $('zr').onclick=e=>{const b=e.target.closest('[data-df]');if(!b||(b.classList.contains('na')&&!b.classList.contains('alt')))return;SS.diff=b.dataset.df;pr();menu()};
  // 曲リスト: タップで選択 / 上下スワイプ / ホイール / ▲▼
  $('zl').addEventListener('pointerdown',e=>{
    const t=e.target.closest('[data-d]'),dd=t?+t.dataset.d:0,y0=e.clientY,i0=selIdx;let moved=false;
    closeMenus();
    const mv=ev=>{const dy=ev.clientY-y0;if(Math.abs(dy)>8)moved=true;if(moved)selGo(i0+Math.round(-dy/(64*SS.sc)))};
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);if(!moved&&dd)selGo(selIdx+dd)};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
  });
  let wt=0;
  $('zs').addEventListener('wheel',e=>{e.preventDefault();const n=performance.now();if(n-wt<70)return;wt=n;selGo(selIdx+Math.sign(e.deltaY))},{passive:false});
  // スクロールつまみ
  const zk=$('zk'),setK=e=>{const r=zk.getBoundingClientRect(),u=Math.min(1,Math.max(0,(e.clientY-r.top-25*SS.sc)/(r.height-50*SS.sc)));selGo(Math.round(u*(selVis.length-1)),true)};
  zk.addEventListener('pointerdown',e=>{zk.setPointerCapture(e.pointerId);setK(e);zk.onpointermove=setK});
  zk.addEventListener('pointerup',()=>{zk.onpointermove=null});
  ringInit();fitSel();refreshVis();renderSel();
}
{const b=document.createElement('button');b.id='tshow';b.textContent='🎨 調整パネル';b.onclick=()=>{$('tp').style.display='block';b.style.display='none'};document.body.append(b)}
show(false);
loadSE();
// 保存済みの曲を読み込み → タイトルに反映 → シートの更新を確認(通信できなければ何も出さない)
loadStore().then(()=>{if($('go'))show(false);return checkUpdates(false)}).catch(()=>{});
</script>
