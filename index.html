<script>
// ===== 開発者モード: URLに ?dev=1 を付ける / タイトルの「ver.proto」を素早く7回タップで切替 =====
let DEV=false;try{DEV=/[?&]dev(=1|&|$)/.test(location.search)||localStorage.getItem('amatDev')==='1'}catch(e){}
// ===== 判定幅の既定値(ms) [前,後] 前=ノーツより早い側 / 後=遅い側 =====
// タップ系: 内側から perfect→great→good→bad→miss。missの前=ノーツがタッチを吸い始める位置、後=自動missになる位置
// 反応範囲系(hit): 前=この時間前から反応 / 後=この時間を過ぎたらmiss(ダメージは当たり判定の時間)
const T5=()=>({perfect:[50,50],great:[85,85],good:[120,120],bad:[160,160],miss:[160,160]});
const WD={"tap":{"perfect":[50,50],"great":[80,80],"good":[105,105],"bad":[125,125],"miss":[150,150]},"flick":{"perfect":[50,50],"great":[60,80],"good":[0,105],"bad":[0,125],"miss":[0,150]},"head":{"perfect":[50,50],"great":[80,80],"good":[105,105],"bad":[125,125],"miss":[150,150]},"trace":{"hit":[120,120]},"tick":{"hit":[0,0]},"damage":{"hit":[0,10]}};
// ===== 設定シート(スプレッドシートの2枚目「settings」タブ)で管理する値 =====
// 判定幅(win.*)・スコア配分(score.*)・ノーツSE(se.*)・見た目(style.*)。更新確認のたびに取得し、この端末に保存する(オフラインでも前回の値で動く)
const SCK='amatSheetCfg';
let SHC={};try{SHC=JSON.parse(localStorage.getItem(SCK)||'{}')||{}}catch(e){SHC={}}
const OLD_DEV_TOOLS=false; // 判定幅/スコア配分/SE音声の開発者用編集画面は、設定シートへ移行したため非表示
// ===== 設定（あとで調整する値）=====
const CFG={
  scroll:1.1,            // ノーツが画面上端から判定線まで落ちる秒数
  judgeY:.82,            // 判定線の高さ(画面比)
  offset:0,              // 音ズレ補正(秒)。ズレるなら調整
  wins:null,             // 判定幅(ms)。設定画面→判定幅の設定 で変更(WD参照)
  score:{perfect:1000,great:700,good:400,bad:100,miss:0},
  se:true,simul:true,showScore:true,keys:false,sendScore:true, // 設定画面で切替(sendScore=スコアをシートへ送信)
  mirror:false,auto:false,constSpeed:false,comboFx:true,flDisp:true,lite:false,fps:false,fpsCap:120,uiSe:true,scoreMode:'add',btPts:true, // ミラー譜面 / オート / 等速(ソフランなし) / AP・FC継続中のコンボ演出
  scoreCfg:null,         // スコア配分(開発者のみ反映。SCD参照)
  seVol:80,seCfg:null // ノーツSE: 全体音量(0-100) / 種別ごとの {tone,vol,name}
};
// ===== ノーツSE設定(種別・音色の定義と保存値の補正)=====
const SEK=[['tap','タップ'],['flick','フリック'],['trace','トレース・中継点'],['crit','クリティカル(タップ・ロング始点)'],['critflick','クリティカル・フリック'],['crittrace','クリティカル・トレース/中継点'],['dmghit','ダメージ(押した時)'],['dmgsafe','ダメージ(押さなかった時)']];
const DEFT={dmghit:'drum',dmgsafe:'chime'}; // 新しい種別の既定の音色(未設定のとき)
const CRITK=['critflick','crittrace']; // 未設定ならクリティカル(crit)の設定を引き継ぐ(従来どおりの音になる)
const SETONE=[['beep','ピッ(標準)'],['click','コッ(木魚)'],['tick','チッ(ハイハット)'],['drum','ドッ(太鼓)'],['chime','チリン(鈴)'],['pop','ポッ'],['clap','パッ(拍手)'],['off','無音']];
// ★埋め込みSE: 開発者モードで読み込んだ音声を「埋め込み用に書き出し」→ ここへ貼り付けると、全員が使える内蔵音色になる
// 形式: {tap:{name:'xxx.wav',data:'base64...'},flick:{...},trace:{...},crit:{...},critflick:{...},crittrace:{...}}  (置いた種別は既定の音色になる)
const SE_EMBED={};
const shEm=k=>{const s=SHC.se&&SHC.se.kinds;return !!(s&&((s[k]&&s[k].url)||(CRITK.includes(k)&&s.crit&&s.crit.url)))}; // 設定シートで音声URLが指定されている種別(起動直後は音声が未デコードでも「内蔵音声あり」とみなす)
function normSE(){ // 壊れた値・未知の音色は既定(埋め込みがあればそれ/無ければピッ、音量100)に戻す
  const o={},src=CFG.seCfg||{};
  for(const [k] of SEK){
    const inh=CRITK.includes(k),v=src[k]||(inh?src.crit:null)||{},em=SE_EMBED[k]||(inh&&SE_EMBED.crit)||shEm(k);
    o[k]={tone:v.tone==='custom'||SETONE.some(t=>t[0]===v.tone)||(v.tone==='embed'&&em)?v.tone:(em?'embed':(DEFT[k]||'beep')),
      vol:Number.isFinite(v.vol)?Math.min(100,Math.max(0,Math.round(v.vol))):100,
      name:typeof v.name==='string'?v.name:''};
  }
  CFG.seCfg=o;
  CFG.seVol=Number.isFinite(CFG.seVol)?Math.min(100,Math.max(0,Math.round(CFG.seVol))):80;
}
const PK='amatPrefs';
function savePrefs(){try{localStorage.setItem(PK,JSON.stringify({scroll:CFG.scroll,offset:CFG.offset,se:CFG.se,simul:CFG.simul,showScore:CFG.showScore,keys:CFG.keys,wins:CFG.wins,seVol:CFG.seVol,seCfg:CFG.seCfg,seSig:CFG.seSig,mirror:CFG.mirror,auto:CFG.auto,sendScore:CFG.sendScore,constSpeed:CFG.constSpeed,comboFx:CFG.comboFx,flDisp:CFG.flDisp,lite:CFG.lite,fps:CFG.fps,fpsCap:CFG.fpsCap,uiSe:CFG.uiSe,scoreMode:CFG.scoreMode,btPts:CFG.btPts,scoreCfg:CFG.scoreCfg}))}catch(e){}}
try{Object.assign(CFG,JSON.parse(localStorage.getItem(PK)||'{}'))}catch(e){}
normSE();
function normWins(){ // 既定値に設定シートの値を重ねる(壊れた値は既定に戻す)
  const o={};
  for(const k in WD){o[k]={};for(const j in WD[k]){const v=SHC.win&&SHC.win[k]&&SHC.win[k][j];o[k][j]=Array.isArray(v)&&v.length===2&&v.every(x=>isFinite(x)&&x>=0)?[+v[0],+v[1]]:WD[k][j].slice()}}
  CFG.wins=o;
}
normWins();
// ===== スコア配分 =====
// 各判定の重み w(カテゴリ別・通常/クリティカル) の合計で 1,000,000点 を按分し、精度 acc を掛けて加点。
// フルコンボ(コンボ切れ0)で fc、さらにオールパーフェクトで ap を加算 → 満点 1,010,000
const SCD={w:{tap:1,flick:1.5,trace:1,head:1,edge:1,relay:1,tick:.5,ctap:2,cflick:3,ctrace:2,chead:2,cedge:2,crelay:2,ctick:1},acc:{perfect:1,great:.7,good:.4,bad:.1,miss:0},fc:5000,ag:7500,ap:10000}; // ボーナス点は合計値(FC/AG/AP それぞれ達成時にもらえる点)
function normScore(){ // 保存値は開発者のみ反映(一般ユーザーは常に既定値)
  const sv=SHC.score||{},o=JSON.parse(JSON.stringify(SCD));
  for(const k in o.w){const v=sv.w&&sv.w[k];if(Number.isFinite(v)&&v>=0)o.w[k]=v}
  for(const k in o.acc){const v=sv.acc&&sv.acc[k];if(Number.isFinite(v)&&v>=0&&v<=1)o.acc[k]=v}
  for(const k of ['fc','ag','ap']){const v=sv[k];if(Number.isFinite(v)&&v>=0)o[k]=Math.round(v)}
  CFG.scoreCfg=o;
}
normScore();
const NAMES=['perfect','great','good','bad','miss'];
let WC={},ut=-9; // ut=前フレームの時刻
function effWin(k){ // 外側の判定は内側より狭くならないよう累積maxで補正(ms)
  const w=CFG.wins[k],o={};let pe=0,pl=0;
  for(const j in w){if(j==='hit'){o.hit=w.hit.slice();continue}pe=Math.max(pe,w[j][0]);pl=Math.max(pl,w[j][1]);o[j]=[pe,pl]}
  return o;
}
function buildWC(){WC={};for(const k in WD){const e=effWin(k);WC[k]={};for(const j in e)WC[k][j]=[e[j][0]/1000,e[j][1]/1000]}}
buildWC();
let L=4,notes=[],song0=0,ctx=null,run=false,end=0,custom=null,msg='',audioBuf=null,audioName='',src=null,off=0;
let TM=[],SC=new Map(),bars=[],barSet=new Set();
let autoRun=false,brk=0,nonP=0,lastFL=null,SM={W:0,unit:0}; // オート中か / コンボ切れ回数 / perfect以外の回数 / スコア配分(重み合計・1重みあたりの点)
let cnt={},late=0,fast=0,fin0=0,combo=0,maxCombo=0,score=0,lostS=0,last='',lastT=-9,held=[],ptr=new Map(),pp=new Map();
const cv=document.getElementById('c'),g=cv.getContext('2d',{alpha:false}),ov=document.getElementById('ov');
function fit(){const d=CFG.lite?1:Math.min(2,devicePixelRatio||1); // 解像度は最大2倍まで(3倍の端末で重くなるため)
  cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit);fit();

// ===== 譜面フォーマット =====
// {title,bpm,lanes,notes:[{type,beat,lane,width?,crit?,len?}]}  type: tap/flick/trace/damage/long
// lane=左端のレーン(0始まり)、width=またがるレーン数(省略で1)、len=ロングの長さ(拍)
function demoChart(n,bpm=140){
  const out=[];let k=0;
  for(let b=2;b<66;b++){
    const bar=b>>3,pos=b%8,last=n-1;
    if(bar%4===1&&pos===4)out.push({type:'slide',points:[{beat:b,lane:last},{beat:b+3,lane:last}],head:'flick'});
    else if(bar%4===3&&pos===4)out.push({type:'slide',curve:'smooth',points:[{beat:b,lane:0},{beat:b+1.5,lane:n-2,width:2},{beat:b+3,lane:1}],tail:'flick',relays:[b+.75,b+2.25]});
    else if(bar===0&&pos===4)out.push({type:'guide',curve:'out',points:[{beat:b,lane:0},{beat:b+3,lane:n-2,width:2}]});
    else if(bar%2===1&&pos>4)continue;
    else if(bar%2===0&&bar%4!==0&&pos===6)out.push({type:'damage',beat:b,lane:last});
    else if(pos===3)out.push({type:'trace',beat:b,lane:k++%(n-1)});
    else if(pos===5&&bar%2===0)out.push({type:'flick',beat:b,lane:k++%(n-1),layer:'fast'});
    else if(pos===0)out.push({type:'tap',beat:b,lane:0,width:2,crit:true});
    else if(pos===1&&bar%2===0)out.push({type:'tap',beat:b,lane:n-2,from:0,moveAt:2});
    else out.push({type:'tap',beat:b,lane:k++%(n-1)});
  }
  return {title:'デモ',lanes:n,
    tempo:[{beat:0,bpm},{beat:32,bpm:bpm+30}],
    meter:[{beat:0,num:4,den:4},{beat:48,num:3,den:4}],
    scroll:[{beat:40,speed:0},{beat:41,speed:2,ramp:true},{beat:44,speed:1},{beat:52,speed:-1},{beat:53,speed:1}],
    layers:{fast:[{beat:0,speed:1.8}]},
    notes:out};
}
function validate(c){
  const err=m=>{throw Error(m)};
  if(!(c.lanes>=1)||!Array.isArray(c.notes))err('lanes・notes が必要です');
  if(c.offset!==undefined&&typeof c.offset!=='number')err('offset は数値(秒)です');
  const asc=(a,nm,f)=>{
    if(!Array.isArray(a))err(nm+' は配列です');
    a.forEach((q,i)=>{
      if(!(q.beat>=0)||(i&&q.beat<=a[i-1].beat))err(nm+'['+i+'] の beat が不正です(0以上・昇順)');
      f(q,i);
    });
  };
  if(c.tempo===undefined&&!(c.bpm>0))err('bpm か tempo が必要です');
  const tp=c.tempo||[{beat:0,bpm:c.bpm}];
  asc(tp,'tempo',q=>{if(!(q.bpm>0))err('tempo の bpm は正の数です')});
  if(!tp.length||tp[0].beat!==0)err('tempo は beat 0 から始めてください');
  if(c.meter){
    asc(c.meter,'meter',q=>{if(!Number.isInteger(q.num)||q.num<1||![1,2,4,8,16].includes(q.den))err('meter の num/den が不正です')});
    if(!c.meter.length||c.meter[0].beat!==0)err('meter は beat 0 から始めてください');
  }
  const sp=q=>{if(typeof q.speed!=='number')err('speed は数値です')};
  if(c.scroll)asc(c.scroll,'scroll',sp);
  for(const k in c.layers||{})asc(c.layers[k],'layers.'+k,sp);
  const T=['tap','flick','trace','damage','long','slide','guide'];
  const bad=(i,m)=>{throw Error('notes['+i+'] '+m)};
  const inR=(l,w)=>l>=0&&w>0&&l+w<=c.lanes;
  c.notes.forEach((d,i)=>{
    if(!T.includes(d.type))bad(i,'の type が不正です');
    if(d.layer!==undefined&&!(String(d.layer) in (c.layers||{})))bad(i,'の layer が layers に未定義です');
    if(d.type==='slide'||d.type==='guide'){
      const p=d.points;
      if(!Array.isArray(p)||p.length<2)bad(i,'の points は2点以上必要です');
      p.forEach((q,j)=>{
        if(!(q.beat>=0)||(j&&q.beat<=p[j-1].beat))bad(i,'の points['+j+'] の beat が不正です(昇順に)');
        if(!inR(q.lane,q.width||1))bad(i,'の points['+j+'] が範囲外です');
      });
    }else{
      if(!(d.beat>=0))bad(i,'の beat が不正です');
      if(!inR(d.lane,d.width||1))bad(i,'の lane/width が範囲外です');
    }
    if(d.type==='long'&&!(d.len>0))bad(i,'の len が必要です');
    if(d.relays!==undefined&&!(Array.isArray(d.relays)&&d.relays.every(v=>typeof v==='number')))bad(i,'の relays は拍の数値配列です');
    if(d.head!==undefined&&!['tap','flick','trace','damage','none'].includes(d.head))bad(i,'の head は tap/flick/trace/damage/none');
    if(d.tail!==undefined&&!['none','tap','flick','trace','damage','hold'].includes(d.tail))bad(i,'の tail は none/tap/flick/trace/damage');
    if(d.from!==undefined){const ml=d.moveLen??1,ma=d.moveAt??2;if(!inR(d.from,d.width||1)||!(ml>0)||ma<ml)bad(i,'の from/moveAt/moveLen が不正です')}
  });
}

// ===== テンポ・ソフラン =====
// 拍→秒: テンポ変化に対応。落下は「秒」基準なのでBPMが変わっても速さは変わらない
function B2S(b){let i=TM.length-1;while(i>0&&TM[i].beat>b)i--;return TM[i].sec+(b-TM[i].beat)*60/TM[i].bpm}
// スクロール位置 S(t)=∫速度dt。全体ソフラン×レイヤーを区間ごとに2次式で厳密に積分(ramp対応)
function mkScroll(g,l){
  const ts=[...new Set([0,...g.map(f=>f.t),...l.map(f=>f.t)])].sort((a,b)=>a-b);
  const segs=[];let S=0;
  const ev=(tl,a,m)=>{
    let k=-1;for(let i=0;i<tl.length;i++)if(tl[i].t<=m)k=i;
    if(k<0)return [1,0];
    const f=tl[k],nx=tl[k+1];
    if(f.ramp&&nx&&nx.t>f.t){const sl=(nx.v-f.v)/(nx.t-f.t);return [f.v+sl*(a-f.t),sl]} // 同時刻のマーカーでは0除算しない
    return [f.v,0];
  };
  ts.forEach((a,i)=>{
    const b=ts[i+1],m=b===undefined?a+1:(a+b)/2;
    const [gv,gs]=ev(g,a,m),[lv,ls]=ev(l,a,m);
    const sg={a,S0:S,c0:gv*lv,c1:gv*ls+gs*lv,c2:gs*ls};
    segs.push(sg);
    if(b!==undefined){const x=b-a;S+=sg.c0*x+sg.c1*x*x/2+sg.c2*x*x*x/3}
  });
  return segs;
}
function spos(k,t){
  const segs=SC.get(k);
  if(t<0)return t; // 0秒より前(助走)は常に×1
  let lo=0,hi=segs.length-1;
  while(lo<hi){const m=(lo+hi+1)>>1;if(segs[m].a<=t)lo=m;else hi=m-1}
  const q=segs[lo],x=t-q.a;
  return q.S0+q.c0*x+q.c1*x*x/2+q.c2*x*x*x/3;
}

function mirrorChart(c){ // ミラー譜面: レーンを左右反転(レーン数は同じ)
  const N=c.lanes,f=(l,w)=>N-l-(w||1);
  return {...c,notes:c.notes.map(d=>{
    const o={...d};
    if(d.points)o.points=d.points.map(p=>({...p,lane:f(p.lane,p.width)}));
    else{o.lane=f(d.lane,d.width);if(d.from!==undefined)o.from=f(d.from,d.width)}
    return o;
  })};
}
function compile(c){
  const tp=c.tempo||[{beat:0,bpm:c.bpm}];
  TM=[];let sec=0;
  tp.forEach((q,i)=>{if(i){const p=tp[i-1];sec+=(q.beat-p.beat)*60/p.bpm}TM.push({beat:q.beat,bpm:q.bpm,sec})});
  const mk=fr=>(fr||[]).map(f=>({t:B2S(f.beat),v:f.speed,ramp:!!f.ramp})).sort((x,y)=>x.t-y.t);
  const gt=(CFG.constSpeed&&!BT)?[]:mk(c.scroll); // 等速: ソフラン(scroll/layers)を無視
  SC=new Map([[0,mkScroll(gt,[])]]);
  for(const k in c.layers||{})SC.set(k,mkScroll(gt,(CFG.constSpeed&&!BT)?[]:mk(c.layers[k])));
  const out=[];let lastBeat=0;
  for(const d of c.notes){
    const n={type:d.type,lane:d.lane,w:d.width||1,crit:!!d.crit,color:d.color,t:B2S(d.beat??0),bt:d.beat??0,done:false,sc:d.layer===undefined?0:String(d.layer)};
    if(d.from!==undefined){const ma=d.moveAt??2,ml=d.moveLen??1;n.from=d.from;n.m0=n.t-B2S(d.beat-ma);n.m1=n.t-B2S(d.beat-(ma-ml))}
    lastBeat=Math.max(lastBeat,(d.type==='slide'||d.type==='guide')?d.points[d.points.length-1].beat:d.beat+(d.len||0));
    if(d.type==='long'||d.type==='slide'||d.type==='guide'){
      const ps=d.type==='long'?[{beat:d.beat,lane:d.lane,width:d.width||1},{beat:d.beat+d.len,lane:d.lane,width:d.width||1}]:d.points;
      n.pts=ps.map(p=>({t:B2S(p.beat),lane:p.lane,w:p.width||1,curve:p.curve||d.curve,col:p.color}));
      n.t=n.pts[0].t;n.lane=n.pts[0].lane;n.w=n.pts[0].w;
      n.len=n.pts[n.pts.length-1].t-n.t;n.ti=0;n.ticks=[];
      const b0=ps[0].beat,b1=ps[ps.length-1].beat;

}

function relPend(id){ // 待機中に指を離した → 離した瞬間の時間差で判定
  const t=T();
  for(const n of notes){
    if(n.done||n.pd!==id)continue;
    const sd=t-n.t,j=jname('flick',sd);n.done=true;judge(j,hcOf(n),sd,catN(n));if(j!=='miss')se(n);
  }

const ease=(c,u)=>c==='in'?u*u:c==='out'?1-(1-u)*(1-u):c==='smooth'?u*u*(3-2*u):u; // in=加速 out=減速
function posAt(n,time){ // 帯ノーツの時刻ごとの左端レーン(小数)と幅

function holdsAt(n,time){

  return false;

function autoPlay(t){ // 譜面テストのオート再生: 時刻が来たノーツを全部perfectで処理
  for(const n of notes){
    if(n.done||n.t>t)continue;
    if(n.type==='tap'||n.type==='flick'||n.type==='trace'){n.done=n.head=true;judge('perfect',hcOf(n),undefined,catN(n));se(n)}
    else if(n.type==='damage'){n.done=true;se(n,'dmgsafe')}
    else if(n.pts&&n.type!=='guide'){
      if(!n.head){n.head=true;judge('perfect',hcOf(n),undefined,catN(n));se(n)}
      while(n.ti<n.ticks.length&&n.ticks[n.ti]<=t){judge('perfect',n.crit,undefined,n.tsfx[n.ti]?'relay':'tick');if(n.tsfx[n.ti])se(n,'trace');n.ti++}
    }

}
const UP={src:null,lo:0,sorted:true};
function update(){
  const t=T(),pt=ut;ut=t;
  if(autoRun)autoPlay(t);
  if(UP.src!==notes){UP.src=notes;UP.lo=0;UP.sorted=notes.every((n,i)=>i===0||notes[i-1].t<=n.t)}
  const nn=notes.length,lim=UP.sorted?t+1.5:Infinity; // 時刻順に並んでいるので、まだ先のノーツと処理済みの先頭は飛ばす
  while(UP.lo<nn&&notes[UP.lo].done)UP.lo++;
  for(let ni=UP.lo;ni<nn;ni++){
    const n=notes[ni];
    if(n.t>lim)break;
    if(n.done)continue;
    if(n.type==='tap'||n.type==='flick'){
      if(n.pd!==undefined){if(t>=n.t){n.done=true;judge('perfect',hcOf(n),undefined,catN(n));se(n)}} // 早く擦った分は判定タイミング丁度で確定
      else if(t>n.t+WC[n.type].miss[1]){n.done=n.head=true;judge('miss')}
    }else if(n.type==='trace'){
      const h=WC.trace.hit;
      if(!n.la&&t>=n.t-h[0]&&hd(n))n.la=true; // 早く触れていたら「丁度に触れた」ことにして待つ
      if(n.la){if(t>=n.t){n.done=true;judge('perfect',hcOf(n),undefined,catN(n));se(n)}}
      else if(t>n.t+h[1]){n.done=true;judge('miss')}
    }else if(n.type==='damage'){
      const h=WC.damage.hit; // 前フレーム〜今フレームが範囲と重なればOK(短い範囲でもフレームの隙間で漏れない)
      if(t>=n.t-h[0]&&pt<=n.t+h[1]&&hd(n)){n.done=true;combo=0;brk++;lastFL=null;last='damage';lastT=t;se(n,'dmghit');if(BT&&BT.play)BT.pt+=btCfg().damage} // 押してしまった
      else if(t>n.t+h[1]){n.done=true;se(n,'dmgsafe')} // 押さずに通した
    }else if(n.type==='guide'){
      if(t>n.t+n.len)n.done=true;
    }else{
      if(!n.head&&t>n.t+WC.head.miss[1]){n.head=true;judge('miss')}
      const h=WC.tick.hit;
      while(n.ti<n.ticks.length){
        const tk=n.ticks[n.ti];
        if(!n.tla&&t>=tk-h[0]&&(holdsAt(n,tk)||(t<=tk+h[1]&&holdsAt(n,t))))n.tla=true; // 判定時刻の位置だけでなく、今見えている帯の位置を押していてもOK
        if(n.tla){if(t>=tk){judge('perfect',n.crit,undefined,n.tsfx[n.ti]?'relay':'tick');if(n.tsfx[n.ti])se(n,'trace');n.tla=false;n.ti++}else break}
        else if(t>tk+h[1]){judge('miss');n.ti++}
        else break;
      }
      if(n.head&&n.ti>=n.ticks.length&&t>=n.t+n.len)n.done=true; // 終点の時刻までは帯を残す
    }
  }
}

// レーン配置: レーンの太さは4〜6レーンで共通(細め)。4レーンは従来の間隔のまま隙間が広め、6レーンは間隔を詰めて内側に寄せる。7レーン以上は従来どおり全幅
function geom(w){
  const p6=w/6,li=ST.li;let lp,G;
  if(L>=7){lp=w/L;G=2*li*lp}
  else{
    const T=Math.max(w*.02,p6*(1-2*li)*.84),pt6=T+2*li*p6*.8,pt4=p6*(1-2*li)+2*li*p6*1.5; // T=レーンの太さ / pt6,pt4=6・4レーンのレーン間隔
    lp=pt6+(6-L)*(pt4-pt6)/2;G=lp-T;
  }
  const rp=L>=7?lp:p6; // ノーツの大きさの基準(従来の6レーン相当で固定)
  return {lp,rp,ox:(w-L*lp)/2,IN:G/2,PX:Math.max(0,(lp-rp*(1-2*ST.ni))/2),BX:Math.max(0,(lp-rp*(1-2*ST.bi))/2)};
}
// 押した位置→レーン。隙間は左右どちらか近いレーンに入る(レーン+左右半分の隙間が1マス)

cv.addEventListener('pointerdown',e=>{if(!run||autoRun)return;try{cv.setPointerCapture(e.pointerId)}catch(x){}pp.set(e.pointerId,[e.clientX,e.clientY]);setP(e.pointerId,laneAt(e))});
cv.addEventListener('pointermove',e=>{
  if(!run||!ptr.has(e.pointerId))return;
  const l=laneAt(e);setP(e.pointerId,l);

// ===== 設定: 速度確認(右側の1レーン) と 音に合わせたタイミング調整 =====
function lane1(c,W,H,items,flash){ // 1レーンを描く。items=[{dt,col}] dt=判定線に届くまでの秒数 / flash=判定線のきらめき(0〜1)
  const li=ST.li,p6=W/(1+li),T=Math.max(p6*6*.02,p6*(1-2*li)*.84),jy=H*CFG.judgeY,x0=(W-T)/2;
  const rr1=(x,y,w,hh,r)=>{r=Math.min(r,w/2,hh/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+hh,r);c.arcTo(x+w,y+hh,x,y+hh,r);c.arcTo(x,y+hh,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()};
  c.fillStyle=ST.bg;c.fillRect(0,0,W,H);
  c.fillStyle=ST.lane;c.fillRect(x0,0,T,H);
  c.fillStyle=ST.lc0;c.fillRect(x0-ST.bw/2,0,ST.bw,H);c.fillRect(x0+T-ST.bw/2,0,ST.bw,H);
  c.fillStyle=ST.judge;c.fillRect(0,jy-ST.jw/2,W,ST.jw);
  if(flash>0){c.fillStyle=`rgba(255,255,255,${.35*flash})`;c.fillRect(x0,jy-26,T,26)}
  const ph=Math.max(10,Math.min(p6*ST.nh,70)),pw=p6*(1-2*ST.ni);
  for(const n of items){
    if(n.dt<0)continue;
    const y=jy-n.dt/CFG.scroll*jy;if(y<-ph||y>H+ph)continue;
    rr1((W-pw)/2,y-ph/2,pw,ph,ph/2);c.fillStyle=n.col||ST.tp;c.fill();
    const ih=ph*ST.inner;rr1((W-pw)/2+ph*.45,y-ih/2,pw-ph*.9,ih,ih/2);c.fillStyle='#fff';c.fill();
  }
}
function paint1(cvp,items,flash){ // canvasの実寸に合わせて描く
  const r=cvp.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1),W=Math.max(1,Math.round(r.width*d)),H=Math.max(1,Math.round(r.height*d));
  if(cvp.width!==W||cvp.height!==H){cvp.width=W;cvp.height=H}
  const c=cvp.getContext('2d');c.setTransform(d,0,0,d,0,0);lane1(c,r.width,r.height,items,flash);
}
const SPV={raf:0};
function spvLoop(){ // 設定画面の右側に、現在のノーツ速度で落ちてくる1レーンを出す(2拍/秒のループ)
  const cvp=document.getElementById('spv');
  if(!cvp||!cvp.isConnected||ov.className!=='set'){SPV.raf=0;return}
  const wrap=cvp.parentNode,avail=(innerWidth-560)/2-innerWidth*.025-24; // 設定の列(最大540px)の右に余白があるときだけ表示
  if(avail<72)wrap.style.display='none';
  else{
    wrap.style.display='flex';wrap.style.width=Math.min(190,avail)+'px';
    const iv=.5,tau=performance.now()/1000,items=[];let fl=0;
    for(let k=Math.floor((tau-.2)/iv);k*iv<=tau+CFG.scroll+.05;k++){const dt=k*iv-tau;if(dt>-.2)items.push({dt,col:ST.tp});if(dt<=0&&dt>-.15)fl=Math.max(fl,1+dt/.15)}
    paint1(cvp,items,fl);
  }
  SPV.raf=requestAnimationFrame(spvLoop);
}
const spvStart=()=>{if(!SPV.raf)SPV.raf=requestAnimationFrame(spvLoop)};

// --- 音に合わせたタイミング調整: クリック音に合わせてタップ → ズレの中央値を「タイミング調整」に反映 ---
const CAL={iv:.6,n:20,skip:4,raf:0,run:false,t0:0,taps:[],used:new Set()};
function calClick(at,accent){const c=getCtx(),o=c.createOscillator(),gn=c.createGain();o.type='sine';o.frequency.value=accent?1500:1000;
  gn.gain.setValueAtTime(0,at);gn.gain.linearRampToValueAtTime(.5,at+.002);gn.gain.exponentialRampToValueAtTime(.001,at+.07);o.connect(gn);gn.connect(c.destination);o.start(at);o.stop(at+.09)}
function calTap(e){
  if(!CAL.run||(e&&e.target&&e.target.closest&&e.target.closest('button')))return;
  if(e&&e.type==='keydown'){if(e.repeat)return;if(e.code!=='Space'&&e.code!=='Enter')return;e.preventDefault()}
  const tt=getCtx().currentTime,k=Math.round((tt-CAL.t0)/CAL.iv);
  if(k<CAL.skip||k>=CAL.n||CAL.used.has(k))return;
  const d=tt-(CAL.t0+k*CAL.iv);if(Math.abs(d)>.28)return; // 大きく外れたタップは無視
  CAL.used.add(k);CAL.taps.push(d);
}
function stopCal(){CAL.run=false;if(CAL.raf)cancelAnimationFrame(CAL.raf);CAL.raf=0;removeEventListener('pointerdown',calTap);removeEventListener('keydown',calTap)}
function calLoop(){
  const cvp=document.getElementById('calc');
  if(!cvp||!cvp.isConnected||ov.className!=='set'){stopCal();return}
  const c=getCtx(),now=c.currentTime,items=[];let fl=0;
  if(CAL.run){
    for(let k=0;k<CAL.n;k++){const dt=CAL.t0+k*CAL.iv-now;if(dt>-.2&&dt<CFG.scroll+.1)items.push({dt,col:k<CAL.skip?'#9aa0b0':ST.tp});if(dt<=0&&dt>-.15)fl=Math.max(fl,1+dt/.15)}
    const st=$('calst'),meas=CAL.taps.length;
    if(st)st.textContent=now<CAL.t0?'準備…':(now<CAL.t0+CAL.skip*CAL.iv?'カウント中(まだ測りません)':`測定中 ${meas} / ${CAL.n-CAL.skip}`);
    if(now>CAL.t0+(CAL.n-1)*CAL.iv+.8){calResult();return}
  }
  paint1(cvp,items,fl);CAL.raf=requestAnimationFrame(calLoop);
}
function calStart(){
  const c=getCtx();if(c.resume)c.resume();
  CAL.t0=c.currentTime+1.2;CAL.taps=[];CAL.used=new Set();CAL.run=true;
  for(let k=0;k<CAL.n;k++)calClick(CAL.t0+k*CAL.iv,k%4===0);
  addEventListener('pointerdown',calTap);addEventListener('keydown',calTap);
  $('calres').innerHTML='';$('calgo').style.display='none';
  if(!CAL.raf)CAL.raf=requestAnimationFrame(calLoop);
}
function calResult(){
  CAL.run=false;removeEventListener('pointerdown',calTap);removeEventListener('keydown',calTap);
  const a=[...CAL.taps].sort((x,y)=>x-y),n=a.length,need=Math.ceil((CAL.n-CAL.skip)/2);
  const st=$('calst'),box=$('calres');if(st)st.textContent='';
  const retry='<button class="sm" id="calre">もう一度</button>';
  if(n<need){box.innerHTML=`<p>タップが少なすぎました(${n}回)。クリック音に合わせて、${CAL.n-CAL.skip}回ほどタップしてください。</p><div class="row">${retry}</div>`}
  else{
    const med=a.length%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2,mean=a.reduce((s,x)=>s+x,0)/n,sd=Math.sqrt(a.reduce((s,x)=>s+(x-mean)**2,0)/n);
    const ms=Math.max(-500,Math.min(500,Math.round(med*1000))),cur=Math.round(CFG.offset*1000);
    box.innerHTML=`<p class="calr">タップは音より<br><b>${ms>0?'+':''}${ms}ms</b> ${ms>2?'遅め':ms<-2?'早め':'ほぼぴったり'}<br><span style="font-size:13px">(${n}回 / ばらつき ±${Math.round(sd*1000)}ms)</span></p>`
      +(sd>.04?'<p style="font-size:13px;color:#c00">ばらつきが大きいです。もう一度やり直すと精度が上がります。</p>':'')
      +`<p style="font-size:13px">適用すると「タイミング調整」が ${cur}ms → <b>${ms}ms</b> になります</p>`
      +`<div class="row"><button class="sm on" id="calap">この値にする</button>${retry}</div>`;
    $('calap').onclick=()=>{CFG.offset=ms/1000;savePrefs();stopCal();showSet()};
  }
  $('calre').onclick=()=>{box.innerHTML='';$('calgo').style.display='';CAL.taps=[];CAL.used=new Set();if(!CAL.raf)CAL.raf=requestAnimationFrame(calLoop)};
}
function showCal(){
  stopCal();ov.style.display='flex';ov.className='set';
  ov.innerHTML='<div class="frame"></div><button class="bk" id="bk">'+IC("back")+'</button><div style="height:46px"></div>'
   +'<div class="lab"><span><b>音に合わせて調整</b></span></div>'
   +'<p style="font-size:14px;max-width:440px">クリック音に合わせて、画面をどこでもタップ(キーボードはスペース)してください。最初の4拍はカウントで、そのあと16回ぶん測ります。普段遊ぶときと同じイヤホン・スピーカーで行ってください。</p>'
   +'<div class="calw"><canvas id="calc"></canvas></div><div id="calst" style="min-height:22px;font-weight:700"></div>'
   +'<div id="calres"></div><div class="row"><button class="sm on" id="calgo" style="font-size:16px;padding:8px 26px">スタート</button></div>';
  $('bk').onclick=()=>{stopCal();showSet()};$('calgo').onclick=calStart;
  CAL.raf=requestAnimationFrame(calLoop);
}
const WK={tap:'タップ',flick:'フリック',head:'ロング・スライドの始点',trace:'トレース・終点ホールド',tick:'中継点(途中の粒)',damage:'ダメージ'};
const WH={trace:'前: この時間より前から指が乗っていれば判定 / 後: この時間を過ぎても指が無いとmiss',tick:'前: 粒より何ms前から判定するか / 後: 粒を過ぎて何msまで待つか(0=ぴったり)',damage:'この範囲で指が乗っているとダメージ(前=何ms前から / 後=何ms後まで)'};
const WCOL={perfect:'#8aa8ff',great:'#6a2cff',good:'#ff5a10',bad:'#1aa81a',miss:'#10105a',hit:'#e0a000'};
function wbox(k){
  const w=effWin(k),ks=Object.keys(w);let sc=50;
  for(const j of ks)sc=Math.max(sc,w[j][0],w[j][1]);sc=Math.ceil(sc*1.05);
  const seg=[...ks].reverse().map(j=>{const[a,b]=w[j];return `<i style="left:${50-a/sc*50}%;width:${(a+b)/sc*50}%;background:${WCOL[j]}"></i>`}).join('');
  return `<div class="wb">${seg}<u></u></div><div class="wc"><span>← 早い -${sc}ms</span><span>遅い +${sc}ms →</span></div>`;
}

  for(const k in WD){

    h+=`<div class="row" style="margin-top:4px"><button class="sm" data-rk="${k}">リセット</button>${k==='flick'||k==='head'?`<button class="sm" data-ck="${k}">タップと同じ値にする</button>`:''}</div>`;
  }
  h+='<div class="row" style="margin:14px 0 6px"><button class="sm" id="wall">全部リセット</button><button class="sm on" id="wex">既定値用に書き出し</button></div><textarea id="wtx" rows="5" readonly style="width:min(88vw,420px);font-size:11px;margin-bottom:30px" placeholder="押すとここに出力されます"></textarea>';

async function btJoin(room){
  if(!PL.id){PL.id=rid();savePL()}
  BT={room,alive:true,out:{},st:null,off:0,scr:'',opp:null,play:false,pt:0,draft:{diff:'hard',mode:'select'},fail:0};
  try{await btSync()}catch(e){BT=null;throw e}
  btLoop();
}
async function btLoop(){
  const b=BT;
  while(BT===b&&b.alive){
    await Promise.race([sleep(b.p2p?(b.play?700:500):b.play?300:(b.st&&(b.st.phase==='play'||b.st.phase==='room')?250:600)),new Promise(r=>{b.wake=r})]);b.wake=null;
    if(BT!==b)break;
    try{await btSync()}catch(e){
      if(BT!==b)break;b.fail++;
      if(b.fail>=6&&!b.play){const m=e.message;BT=null;b.alive=false;showBtEntry(m+'(接続が切れました)');break}
    }

const btPush=()=>{const b=BT;if(!b)return;const m=b.out&&b.out.me;if(m&&m.ready!==undefined){b.myR=m.ready?1:0;btSend({t:'r',v:b.myR});btGoCheck()}if(b.wake)b.wake()};
async function btSync(){
  const b=BT;if(!b)return;
  const out=b.out;b.out={};
  const body={room:b.room,pid:PL.id,name:btName(),...out};
  if(b.play)body.me={...(out.me||{}),combo,pt:b.pt};
  const url=saveUrl(),t0=Date.now();let j,t1;
  try{
    const js=JSON.stringify(body);let r;
    if(js.length>1500)r=await fetch(url,{method:'POST',body:JSON.stringify({battle:body}),redirect:'follow'});
    else r=await fetch(url+(url.includes('?')?'&':'?')+'battle='+encodeURIComponent(js),{redirect:'follow'});
    j=await r.json();t1=Date.now();
  }catch(e){b.out={...out,...b.out};throw Error('通信できません(Apps Scriptのsave.urlを確認)')}
  if(!j||!j.ok){
    if(j&&j.full)throw Error('この部屋は満員です');
    if(j&&j.msg)throw Error('Apps Scriptを最新版に貼り替えて再デプロイしてください(バトル用の追加が必要です)');
    b.out={...out,...b.out};throw Error((j&&j.error)||'エラー');
  }
  if(BT!==b)return;
  const rtt=t1-t0;b.rtt=(b.rtt||1e9)*1.02;if(rtt<=b.rtt){b.rtt=rtt;b.off=j.now-(t0+t1)/2}else if(b.off===0)b.off=j.now-(t0+t1)/2;b.st=j;b.fail=0;btOnState();

const btNowS=()=>Date.now()+(BT?BT.off:0); // サーバー時刻
function btOnState(){
  const st=BT.st,me=st.players[PL.id],oid=Object.keys(st.players).find(k=>k!==PL.id),opp=oid?st.players[oid]:null;
  if(!me)return;
  if(opp)BT.opp=opp;
  BT.me=me;BT.cur=opp;BT.isHost=st.host===PL.id;
  if(BT.lph!==st.phase){BT.lph=st.phase;BT.opr=undefined;BT.myR=undefined;BT.go=0}
  btP2PSync();
  if(BT.play||BT.cd)return; // 対戦中は画面を触らない(drawが BT.cur を読む)
  const ph=st.phase,cfg=st.cfg||{};if(ph!=='room')BT.inSet=false;
  if(BT.scr==='result'){if(ph==='room'||ph==='lobby'){BT.scr='';BT.pfin=null;btOnState()}else btRenderResult();return}
  const sig=s=>JSON.stringify(s);
  if(ph==='lobby'){
    btGoCheck();
    const g=sig([me.n,me.ready,opp&&[opp.n,opp.ready],BT.isHost,!!BT.p2p]);
    if(BT.scr!=='lobby'||BT.sig!==g){BT.scr='lobby';BT.sig=g;btLobby(me,opp)}
  }else if(ph==='cfg'){
    if(BT.isHost){if(BT.scr!=='cfg'){BT.scr='cfg';btCfgScr()}}
    else if(BT.scr!=='waitcfg'){BT.scr='waitcfg';btScr('<div class="bth">親が対戦設定中…</div><div class="btmsg">しばらくお待ちください</div>',btLeave)}
  }else if(ph==='pick'){
    if(BT.isHost){if(BT.scr!=='pick'){BT.scr='pick';BT.pick=true;BT.prevDiff=SS.diff;SS.diff=cfg.diff||'hard';BT.cfgNow=cfg;showSelect()}}
    else if(BT.scr!=='waitpick'){BT.scr='waitpick';btScr('<div class="bth">親が選曲中…</div><div class="btmsg">難易度: '+esc(DNAME[cfg.diff]||cfg.diff||'')+'</div>',btLeave)}
  }else if(ph==='roulette'){
    if(BT.scr!=='roulette'||BT.rl!==cfg.song){BT.scr='roulette';BT.rl=cfg.song;btRoulette(cfg)}
  }else if(ph==='room'){
    if(BT.pick){BT.pick=false;if(BT.prevDiff){SS.diff=BT.prevDiff;BT.prevDiff=''}}
    if(BT.rlBusy)return;
    btGoCheck();
    if(BT.inSet)return;
    const g=sig([cfg,me.n,me.ready,opp&&[opp.n,opp.ready],CFG.btPts,!!BT.p2p]);
    if(BT.scr!=='room'||BT.sig!==g){BT.scr='room';BT.sig=g;btRoom(me,opp,cfg)}
  }else if(ph==='play'){
    if(BT.started!==st.start){BT.started=st.start;btCountdown(cfg,st.start-BT.off)}
  }
}

// --- P2P(WebRTC DataChannel): 相手と直接やりとりして遅れを減らす。つながらない時は従来のApps Script経由のまま ---
const BT_ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
function btNet(){const e=ov&&ov.querySelector('.btnet');if(!e)return;const on=BT&&BT.p2p;e.className='btnet'+(on?' on':'');e.textContent=BT?(on?'● 高速通信(P2P)':'○ 通常通信'):''}
function btSend(o){const b=BT;if(b&&b.dc&&b.dc.readyState==='open'){try{b.dc.send(JSON.stringify(o));return 1}catch(e){}}return 0}
function btOpp(){const b=BT,o=b.cur;if(!o)return o;let r=o;
  if(b.pf&&Date.now()-b.pf.at<2500)r={...r,combo:b.pf.c,pt:b.pf.p};
  if(b.pfin)r={...r,fin:1,res:b.pfin.res,pt:b.pfin.p,combo:0};
  return r}
function btP2PClose(keep){const b=BT;if(!b)return;
  clearInterval(b.pit);clearInterval(b.siv);
  try{b.dc&&b.dc.close()}catch(e){}try{b.pc&&b.pc.close()}catch(e){}
  const was=b.p2p;b.pc=b.dc=null;b.p2p=false;b.pk='';b.pans=0;b.pf=null;b.poff=undefined;b.prtt=0;
  if(b.out)b.out.me=Object.assign(b.out.me||{},{sig:null});
  if(!keep){b.oid=null;b.ptry=0;b.pstop=0}
  if(was)btNet();
  if(was&&b.play){clearInterval(b.siv);b.siv=setInterval(()=>{if(BT&&BT.play)btSend({t:'s',c:combo,p:BT.pt})},100)}}
function btP2PSync(){
  const b=BT,st=b.st,oid=Object.keys(st.players).find(k=>k!==PL.id);
  if(!oid){if(b.oid)btP2PClose();return}
  if(b.oid!==oid){btP2PClose();b.oid=oid}
  if(b.p2p||b.play||b.pstop||!window.RTCPeerConnection)return;
  const os=st.players[oid].sig;
  if(PL.id<oid){
    if(!b.pc)btP2PStart();
    else if(os&&os.type==='answer'&&os.k===b.pk&&!b.pans){b.pans=1;b.pc.setRemoteDescription({type:'answer',sdp:os.sdp}).catch(()=>{})}
  }else if(os&&os.type==='offer'&&os.k!==b.pk)btP2PAnswer(os);
}
const btIce=(pc)=>new Promise(res=>{if(pc.iceGatheringState==='complete')return res();const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);res()}};pc.addEventListener('icegatheringstatechange',f);setTimeout(res,2500)});
function btPcEv(pc,b){pc.onconnectionstatechange=()=>{if(BT===b&&b.pc===pc&&(pc.connectionState==='failed'||pc.connectionState==='closed')){btP2PClose(true);if(++b.ptry>=3)b.pstop=1}}}
async function btP2PStart(){
  const b=BT,k=rid().slice(0,6);b.pk=k;b.pans=0;
  let pc;try{pc=b.pc=new RTCPeerConnection(BT_ICE)}catch(e){b.pstop=1;return}
  btPcEv(pc,b);btDC(pc.createDataChannel('bt'),b);
  try{
    await pc.setLocalDescription(await pc.createOffer());await btIce(pc);
    if(BT!==b||b.pc!==pc)return;
    b.out.me=Object.assign(b.out.me||{},{sig:{k,type:'offer',sdp:pc.localDescription.sdp}});btPush();
    setTimeout(()=>{if(BT===b&&b.pc===pc&&!b.p2p){btP2PClose(true);if(++b.ptry>=3)b.pstop=1}},12000);
  }catch(e){}
}
async function btP2PAnswer(os){
  const b=BT;btP2PClose(true);b.pk=os.k;
  let pc;try{pc=b.pc=new RTCPeerConnection(BT_ICE)}catch(e){b.pstop=1;return}
  btPcEv(pc,b);pc.ondatachannel=e=>btDC(e.channel,b);
  try{
    await pc.setRemoteDescription({type:'offer',sdp:os.sdp});await pc.setLocalDescription(await pc.createAnswer());await btIce(pc);
    if(BT!==b||b.pc!==pc)return;
    b.out.me=Object.assign(b.out.me||{},{sig:{k:os.k,type:'answer',sdp:pc.localDescription.sdp}});btPush();
  }catch(e){}
}
function btDC(dc,b){
  dc.onopen=()=>{if(BT!==b)return;b.dc=dc;b.p2p=true;b.prtt=0;let n=0;
    const ping=()=>btSend({t:'p',a:Date.now()});ping();clearInterval(b.pit);b.pit=setInterval(()=>{ping();if(++n>=5&&b.poff!==undefined&&n===5){clearInterval(b.pit);b.pit=setInterval(ping,3000)}},200);
    btNet()};
  dc.onclose=()=>{if(BT===b&&b.dc===dc){btP2PClose(true);if(++b.ptry>=3)b.pstop=1}};
  dc.onmessage=e=>btMsg(e.data);
}
function btMsg(raw){const b=BT;if(!b)return;let m;try{m=JSON.parse(raw)}catch(e){return}
  if(m.t==='p')btSend({t:'q',a:m.a,b:Date.now()});
  else if(m.t==='q'){const n=Date.now(),rt=n-m.a;b.prtt=(b.prtt||1e9)*1.02;if(rt<=b.prtt||b.poff===undefined){b.prtt=Math.min(b.prtt,rt);b.poff=m.b-(m.a+n)/2}}
  else if(m.t==='s')b.pf={c:m.c|0,p:m.p|0,at:Date.now()};
  else if(m.t==='f'){b.pfin={res:m.res,p:m.p|0};if(b.scr==='result')btRenderResult()}
  else if(m.t==='r'){b.opr=m.v?1:0;btGoCheck()}
  else if(m.t==='go'&&b.poff!==undefined&&!b.play&&b.started!==m.S&&b.st){b.started=m.S;btCountdown(b.st.cfg||{},m.H-b.poff)}
}
// 親: 両者の準備完了を見て進める(相手の準備はP2Pで即座に分かる)
function btGoCheck(){
  const b=BT;if(!b||!b.st||b.play||b.cd||!b.isHost||b.go||!b.cur)return;
  const ph=b.st.phase,mR=b.myR!==undefined?b.myR:(b.me&&b.me.ready),oR=b.opr!==undefined?b.opr:b.cur.ready;
  if(!mR||!oR)return;
  if(ph==='lobby'){b.go=1;b.out.top={phase:'cfg'};b.out.reset=1;if(b.wake)b.wake()}
  else if(ph==='room'&&!b.rlBusy){
    b.go=1;
    if(b.p2p&&b.poff!==undefined){
      const lead=Math.max(3200,Math.round((b.prtt||200)*3)+2500),H=Date.now()+lead,S=btNowS()+lead;
      b.out.top={phase:'play',start:S};btSend({t:'go',S,H});b.started=S;btCountdown(b.st.cfg||{},H);if(b.wake)b.wake();
    }else{b.out.top={phase:'play',start:b.st.now+Math.max(6500,Math.round((b.rtt||800)*4)+4500)};if(b.wake)b.wake()}
  }
}

// --- ルーレット ---
function btRoulette(cfg){
  const pool=SONGS.filter(s=>s.impl!==false&&!s.custom&&hasChart(s,cfg.diff)),tg=SONGS.find(s=>s.id===cfg.song);
  const N=36,tgi=30,items=[];for(let i=0;i<N;i++)items.push(i===tgi?tg:pool[Math.floor(Math.random()*pool.length)]||tg);
  const W=170,G=14;
  btScr(`<div class="btrl"><div class="btrlm">▼</div><div class="btrlv"><div class="btrls" id="btrls" style="width:${N*(W+G)}px">${items.map((s,i)=>`<div class="btrli" data-i="${i}">${btJk(s,W)}</div>`).join('')}</div></div><div class="btrlt" id="btrlt">抽選中…</div></div>`,null,'btrlbg');
  BT.rlBusy=true;
  const strip=$('btrls'),vw=Math.min(innerWidth,900);
  const tx=-(tgi*(W+G)+W/2)+vw/2;strip.style.transform='translateX(0)';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{strip.style.transition='transform 4s cubic-bezier(.12,.6,.1,1)';strip.style.transform=`translateX(${tx}px)`}));
  const rb=BT;
  // カラカラ音: ジャケットが中央を通るたびに鳴らす(減速に合わせて間隔が伸びる)
  {const bz=(x1,y1,x2,y2)=>x=>{let lo=0,hi=1;for(let i=0;i<30;i++){const t=(lo+hi)/2,X=3*(1-t)*(1-t)*t*x1+3*(1-t)*t*t*x2+t*t*t;X<x?lo=t:hi=t}const t=(lo+hi)/2;return 3*(1-t)*(1-t)*t*y1+3*(1-t)*t*t*y2+t*t*t};
   const ease=bz(.12,.6,.1,1),total=-tx;let prev=Math.floor((vw/2)/(W+G));
   for(let ms=0;ms<=4000;ms+=16){const idx=Math.floor((ease(ms/4000)*total+vw/2)/(W+G));if(idx!==prev){prev=idx;setTimeout(()=>{if(BT===rb&&BT.scr==='roulette')btTick()},ms+60)}}}
  setTimeout(()=>{if(BT!==rb)return;const t=$('btrlt');if(t)t.textContent=(tg?tg.title:'')+' に決定!';const it=strip.querySelector(`[data-i="${tgi}"]`);if(it)it.classList.add('hit');uiSE('ok');
    if(tg&&tg.store){PV.keep=true;pvStop(true);PV.id=tg.id;pvPlay(tg,PV.gen)}},4100);
  setTimeout(()=>{if(BT!==rb)return;BT.rlBusy=false;if(BT.isHost){BT.out.top={phase:'room',cfg};BT.out.reset=1;btPush()}},5300);
}
function btTick(){ // カラカラ抽選の1音
  try{const c=getCtx();if(c.state==='suspended')c.resume();const t=c.currentTime,o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();
    o.type='square';o.frequency.value=1500+Math.random()*500;f.type='bandpass';f.frequency.value=2200;f.Q.value=2;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime((CFG.seVol/100)*.35,t+.002);g.gain.exponentialRampToValueAtTime(.001,t+.045);
    o.connect(f);f.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.06)}catch(e){}
}

function btCountdown(cfg,startAt){

async function btBegin(cfg,startAt){

function barBeats(c){ // 各小節の頭の拍(compileと同じ数え方)。.n=最後のノーツまでの小節数
  const ms=c.meter||[{beat:0,num:4,den:4}];let last=0;
  for(const d of c.notes)last=Math.max(last,(d.type==='slide'||d.type==='guide')?d.points[d.points.length-1].beat:(d.beat||0)+(d.len||0));
  const out=[];
  ms.forEach((m,i)=>{const st=m.num*4/m.den,to=i+1<ms.length?ms[i+1].beat:last+8;for(let b=m.beat;b<to-1e-9;b+=st)out.push(b)});
  out.n=Math.max(1,out.filter(b=>b<=last+1e-9).length);
  return out;

function countJudge(ns){ // 実際に判定される数(=最大コンボ)。タップ/フリック/トレース各1、帯ノーツは始点(四角のとき)+8分/中継点。ダメージ・ガイドは数えない
  let c=0;for(const n of ns){if(n.type==='damage'||n.type==='guide')continue;c+=n.pts?((n.hrect?1:0)+n.ticks.length):1}return c;
}
const JB_NAME={tap:'タップ',flick:'フリック',trace:'トレース',edge:'始点・終点',tick:'8分・中継点'};
function judgeBreakdown(ns){ // 判定の種類ごとの数 [全体,うちクリティカル]
  const r={tap:[0,0],flick:[0,0],trace:[0,0],edge:[0,0],tick:[0,0]};
  const add=(k,m,crit)=>{r[k][0]+=m;if(crit)r[k][1]+=m};
  for(const n of ns){
    if(n.type==='damage'||n.type==='guide')continue;
    if(n.pts){if(n.hrect)add('edge',1,n.hc);add('tick',n.ticks.length,n.crit)}
    else add(n.par?'edge':(n.type==='flick'?'flick':n.type==='trace'?'trace':'tap'),1,n.crit);
  }
  return r;
}
const jbText=(jb,i)=>Object.entries(jb).filter(([k,v])=>v[i]).map(([k,v])=>JB_NAME[k]+' '+v[i]).join(' / ')||'なし';
function chartInfo(c){
  const cn={};
  for(const d of c.notes)cn[d.type]=(cn[d.type]||0)+1;
  const ns=compile(c),tot=countJudge(ns),jb=judgeBreakdown(ns);
  const bp=(c.tempo||[{bpm:c.bpm}]).map(t=>t.bpm),lo=Math.min(...bp),hi=Math.max(...bp);
  return {c,cn,tot,jb,sec:Math.max(0,end-3),bpm:lo===hi?''+lo:lo+'〜'+hi,bars:barBeats(c)};
}

function parseCSV(t){
  t=t.replace(/^\uFEFF/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[]}
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}

const PV={id:null,tm:null,src:null,gain:null,gen:0,vol:.6,fade:1.2,gap:1,lru:[],wait:false};
function pvStop(fast){

  if(!(a>=0)||a>=dur-1)a=(b>=0&&b<dur)?Math.max(0,b-15):dur*.2;
  if(!(b>a+1))b=a+15;
  b=Math.min(b,dur);a=Math.max(0,Math.min(a,b-1));return [a,b];

async function pvPlay(s,gen){
  try{

    PV.lru=PV.lru.filter(x=>x!==s);PV.lru.push(s);
    while(PV.lru.length>3){const o=PV.lru.shift();if(!cur||cur.song!==o)o.buf=undefined} // 展開済みの音を3曲分だけ残す
    const c=getCtx();try{await c.resume()}catch(e){}
    if(gen!==PV.gen)return;

    const [a,b]=pvRange(s,s.buf.duration),len=b-a,f=Math.min(PV.fade,len/2.5);

    sr.connect(g);g.connect(c.destination);sr.start(t,a,len);PV.src=sr;PV.gain=g;

}

function scoreView(cv,c,per){

  const clamp=()=>{V.z=Math.max(fitZ*.6,Math.min(3,V.z));const w=vw/V.z,h=vh/V.z;V.x=Math.max(-w*.3,Math.min(M.W-w*.7,V.x));V.y=Math.max(-h*.3,Math.min(M.H-h*.7,V.y))};
  let raf=0;const redraw=()=>{clamp();if(raf)return;raf=requestAnimationFrame(()=>{raf=0;scoreDraw(M,G,vw,vh,dpr,V)})};
  const zoomAt=(sx,sy,nz)=>{const wx=V.x+sx/V.z,wy=V.y+sy/V.z;V.z=Math.max(fitZ*.6,Math.min(3,nz));V.x=wx-sx/V.z;V.y=wy-sy/V.z};

    let z=Math.min(2,14000/M.W,14000/M.H,Math.sqrt(16e6/(M.W*M.H))); // iPhoneなどの上限(約1677万ピクセル)に収める

<script>
// PWA: Service Worker 登録 + 新バージョンの通知(file:// や非対応環境では何もしない)
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  const hadCtrl=!!navigator.serviceWorker.controller;let shown=false;
  async function showUpdate(){
    if(shown)return;shown=true;
    let v='';try{const t=await (await fetch('version.js',{cache:'no-store'})).text();v=(t.match(/APP_VERSION\s*=\s*['"]([^'"]+)['"]/)||[])[1]||''}catch(e){}
    const wait=()=>{ // プレイ中は出さず、終わってから表示
      try{if(typeof run!=='undefined'&&run){setTimeout(wait,3000);return}}catch(e){}
      const d=document.createElement('div');
      d.style.cssText='position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:99999;background:#1b2a6b;color:#fff;border:2px solid #b69cf0;border-radius:12px;padding:10px 14px;font:700 15px/1.3 AmatSans,sans-serif;display:flex;gap:10px;align-items:center;box-shadow:0 4px 16px #0008;max-width:92vw';
      d.innerHTML='<span>新しいバージョン'+(v?' ('+v+')':'')+'があります</span><button style="font:inherit;padding:6px 12px;border-radius:8px;border:0;background:#fff;color:#1b2a6b" id="updgo">更新</button><button style="font:inherit;padding:6px 8px;border:0;background:none;color:#fff" id="updx">✕</button>';
      document.body.append(d);
      d.querySelector('#updgo').onclick=()=>location.reload();
      d.querySelector('#updx').onclick=()=>d.remove();
    };wait();
  }
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      const chk=()=>reg.update().catch(()=>{});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()}); // 開き直すたびに新版を確認
      setInterval(chk,30*60*1000);
    }).catch(()=>{});
    // 初回インストール以外で、新しいService Workerに切り替わったら通知
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtrl)showUpdate()});
  });
}
